name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
    backend:
    name: Backend - build & test
    runs-on: ubuntu-latest
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "AlejandgoShop!2026"
        ports:
          - 1433:1433
        options: >-
          --health-cmd="/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P AlejandgoShop!2026 -C -Q 'SELECT 1' || exit 1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore backend/AlejandgoShop.slnx

      - name: Build
        run: dotnet build backend/AlejandgoShop.slnx --no-restore --configuration Release

      - name: Test
        env:
          ConnectionStrings__DefaultConnection: "Server=localhost,1433;Database=AlejandgoShop;User Id=sa;Password=AlejandgoShop!2026;TrustServerCertificate=True"
        run: dotnet test backend/AlejandgoShop.slnx --no-build --configuration Release
    name: Backend - build & test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore backend/AlejandgoShop.slnx

      - name: Build
        run: dotnet build backend/AlejandgoShop.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test backend/AlejandgoShop.slnx --no-build --configuration Release

  frontend:
    name: Frontend - build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        run: npm run build